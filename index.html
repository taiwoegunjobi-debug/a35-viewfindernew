<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>A35 Anamorphic Viewfinder</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#fff;background:#000}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
#app{position:fixed;inset:0}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
#view{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#status{position:absolute;top:max(10px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:700;text-shadow:0 1px 5px #000;pointer-events:none}
.badge{padding:8px 10px;background:#000b;border-radius:7px;border:1px solid #fff4}
#message{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:14px 18px;background:#000d;border:1px solid #fff5;border-radius:9px;text-align:center;font-size:14px;max-width:82%;display:block;z-index:5}
#bottom{position:absolute;left:0;right:0;bottom:0;padding:10px max(10px,env(safe-area-inset-left)) max(10px,env(safe-area-inset-bottom));background:linear-gradient(transparent,#000e 28%,#000f);z-index:4}
#lenses{display:flex;gap:6px;justify-content:center;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
#lenses::-webkit-scrollbar{display:none}
.lens{flex:0 0 auto;min-width:55px;height:42px;border:1px solid #777;background:#111d;color:#fff;border-radius:7px;font-weight:700;font-size:13px}
.lens.active{background:#fff;color:#000;border-color:#fff}
#controls{display:flex;align-items:center;justify-content:center;gap:14px}
.control{height:48px;min-width:90px;border:1px solid #777;background:#111d;color:#fff;border-radius:8px;font-weight:700}
#photo{width:68px;height:68px;border-radius:50%;border:4px solid #fff;background:#fff8;padding:0}
#start{min-width:120px}
#cameraInfo{font-size:11px;text-align:center;color:#ddd;margin-top:4px;text-shadow:0 1px 4px #000}
@media(max-height:430px){#bottom{padding-top:4px}.lens{height:36px;min-width:50px}.control{height:42px}#photo{width:58px;height:58px}.cameraInfo{font-size:10px}}
</style>
</head>
<body>
<div id="app">
<video id="video" autoplay muted playsinline></video>
<canvas id="view"></canvas>

<div id="status">
  <div class="badge">A35 VIEWFINDER</div>
  <div class="badge"><span id="lensReadout">50mm</span> · <span id="format">2.39:1</span> · <span id="sq">2×</span></div>
</div>

<div id="message">Tap START CAMERA</div>

<div id="bottom">
  <div id="lenses" aria-label="Master Anamorphic lenses"></div>
  <div id="controls">
    <button class="control" id="start">START CAMERA</button>
    <button id="photo" aria-label="Take photo"></button>
    <button class="control" id="flip">FLIP</button>
  </div>
  <div id="cameraInfo">ALEXA 35 · Super 35 · 2× anamorphic · landscape</div>
</div>
</div>

<script>
(function(){
'use strict';

var video=document.getElementById('video');
var canvas=document.getElementById('view');
var ctx=canvas.getContext('2d');
var message=document.getElementById('message');
var start=document.getElementById('start');
var photo=document.getElementById('photo');
var flip=document.getElementById('flip');
var lensReadout=document.getElementById('lensReadout');
var lensesEl=document.getElementById('lenses');
var sqEl=document.getElementById('sq');
var stream=null;
var facing='environment';
var selected=50;
var raf=0;

/*
 ALEXA 35 4.6K Open Gate active image: 28.0 x 19.2 mm.
 Horizontal AOV values below are practical reference values for the
 ARRI/ZEISS Master Anamorphic family on S35. The viewfinder uses
 horizontal FOV to calculate the phone crop.
*/
var lenses=[
 {mm:28,aov:78.2,t:1.9},
 {mm:35,aov:65.5,t:1.9},
 {mm:40,aov:58.7,t:1.9},
 {mm:50,aov:48.5,t:1.9},
 {mm:60,aov:41.1,t:1.9},
 {mm:75,aov:33.4,t:1.9},
 {mm:100,aov:25.4,t:1.9},
 {mm:135,aov:18.9,t:1.9},
 {mm:180,aov:14.4,t:2.8}
];

function show(text){
  message.textContent=text;
  message.style.display='block';
}
function hide(){message.style.display='none'}

function resize(){
  var d=window.devicePixelRatio||1;
  canvas.width=Math.round(window.innerWidth*d);
  canvas.height=Math.round(window.innerHeight*d);
  canvas.style.width=window.innerWidth+'px';
  canvas.style.height=window.innerHeight+'px';
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,250)});

function renderLenses(){
  lensesEl.innerHTML='';
  lenses.forEach(function(l){
    var b=document.createElement('button');
    b.className='lens'+(l.mm===selected?' active':'');
    b.textContent=l.mm+'mm';
    b.type='button';
    b.addEventListener('click',function(){
      selected=l.mm;
      renderLenses();
      update();
    });
    lensesEl.appendChild(b);
  });
}

function currentLens(){
  for(var i=0;i<lenses.length;i++) if(lenses[i].mm===selected) return lenses[i];
  return lenses[3];
}

function phoneFov(){
  // Practical Pixel 6 Pro main-camera horizontal FOV calibration.
  return 82;
}

function cropForLens(){
  var target=currentLens().aov;
  var phone=phoneFov();
  var z=Math.tan(phone*Math.PI/360)/Math.tan(target*Math.PI/360);
  return Math.max(1,Math.min(8,z));
}

function update(){
  var l=currentLens();
  lensReadout.textContent=l.mm+'mm';
  sqEl.textContent='2×';
  video.style.transform='scale('+cropForLens()+')';
  video.style.transformOrigin='center center';
}

function draw(){
  var d=window.devicePixelRatio||1;
  var w=window.innerWidth,h=window.innerHeight;
  ctx.setTransform(d,0,0,d,0,0);
  ctx.clearRect(0,0,w,h);

  // 2.39:1 monitoring frame.
  var fw=w, fh=w/2.39;
  if(fh>h){fh=h;fw=h*2.39}
  var x=(w-fw)/2,y=(h-fh)/2;

  ctx.fillStyle='rgba(0,0,0,.62)';
  ctx.fillRect(0,0,w,y);
  ctx.fillRect(0,y+fh,w,h-y-fh);
  ctx.fillRect(0,y,x,fh);
  ctx.fillRect(x+fw,y,w-x-fw,fh);

  ctx.strokeStyle='rgba(255,255,255,.95)';
  ctx.lineWidth=1.5;
  ctx.strokeRect(x+.5,y+.5,fw-1,fh-1);

  // Center mark.
  ctx.strokeStyle='rgba(255,255,255,.35)';
  ctx.beginPath();
  ctx.moveTo(w/2-12,h/2);ctx.lineTo(w/2+12,h/2);
  ctx.moveTo(w/2,h/2-12);ctx.lineTo(w/2,h/2+12);
  ctx.stroke();

  raf=requestAnimationFrame(draw);
}

async function startCamera(){
  if(!window.isSecureContext){
    show('Camera needs HTTPS. Open the Vercel address in Chrome.');
    return;
  }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    show('Camera is not available in this browser. Use Chrome on the Pixel.');
    return;
  }

  try{
    if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}
    show('Opening camera…');

    var constraints={
      audio:false,
      video:{
        facingMode:{ideal:facing},
        width:{ideal:1920},
        height:{ideal:1080}
      }
    };

    stream=await navigator.mediaDevices.getUserMedia(constraints);
    video.srcObject=stream;
    await video.play();
    hide();
    start.textContent='RESTART';
    update();
  }catch(e){
    console.error(e);
    var n=e&&e.name?e.name:'UnknownError';
    var m={
      NotAllowedError:'Camera permission denied. Allow Camera for this website in Chrome.',
      NotFoundError:'No camera found.',
      NotReadableError:'Camera is busy. Close other camera apps.',
      SecurityError:'Camera blocked by browser security.',
      OverconstrainedError:'Requested camera mode unavailable.'
    }[n] || ('Camera error: '+n);
    show(m);
  }
}

function takePhoto(){
  if(!stream || video.readyState<2){
    show('Start the camera first.');
    return;
  }
  try{
    var l=currentLens();
    var w=video.videoWidth,h=video.videoHeight;
    var target=2.39;
    var cropW=h*target;
    if(cropW>w) cropW=w;
    var sx=(w-cropW)/2;

    var out=document.createElement('canvas');
    out.width=1600;out.height=Math.round(1600/target);
    var o=out.getContext('2d');
    o.drawImage(video,sx,0,cropW,h,0,0,out.width,out.height);

    // Metadata footer outside the frame would change the reference.
    // Keep the image clean; the selected lens is visible in the filename.
    out.toBlob(function(blob){
      if(!blob){show('Could not create photo.');return}
      var a=document.createElement('a');
      a.href=URL.createObjectURL(blob);
      a.download='A35_'+l.mm+'mm_2x_2.39_'+Date.now()+'.jpg';
      document.body.appendChild(a);
      a.click();
      setTimeout(function(){
        URL.revokeObjectURL(a.href);
        a.remove();
      },1000);
    },'image/jpeg',.94);
  }catch(e){
    console.error(e);
    show('Photo capture failed.');
  }
}

start.addEventListener('click',startCamera);
photo.addEventListener('click',takePhoto);
flip.addEventListener('click',function(){
  facing=facing==='environment'?'user':'environment';
  startCamera();
});

resize();
renderLenses();
update();
draw();

})();
</script>
</body>
</html>
