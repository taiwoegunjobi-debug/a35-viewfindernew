<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>A35 Lens Finder</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{touch-action:manipulation}
#app{position:fixed;inset:0}
#camera{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
#view{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#top{position:absolute;top:max(8px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;text-shadow:0 2px 5px #000;z-index:3}
.label{font-size:13px;font-weight:700;background:#0008;padding:7px 9px;border-radius:5px}
#bottom{position:absolute;left:0;right:0;bottom:0;padding:8px 10px max(7px,env(safe-area-inset-bottom));background:linear-gradient(transparent,#000e 32%,#000f);z-index:4}
#lenses{display:flex;justify-content:center;gap:3px;overflow-x:auto;scrollbar-width:none;padding:3px 0 7px}
#lenses::-webkit-scrollbar{display:none}
.lens{flex:0 0 auto;min-width:48px;height:36px;padding:0 8px;border:0;border-radius:5px;background:transparent;color:#ddd;font-weight:700;font-size:12px}
.lens.active{background:#fff;color:#000}
#shutterRow{height:58px;display:flex;justify-content:flex-end;align-items:center;padding-right:3px}
#photo{width:52px;height:52px;border:3px solid #fff;border-radius:50%;background:#ffffff22;padding:0}
#photo:active{transform:scale(.92)}
#start{position:absolute;left:12px;bottom:82px;z-index:8;background:#000b;border:1px solid #fff8;border-radius:6px;color:#fff;padding:9px 12px;font-size:12px;font-weight:700}
#message{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:9;background:#000d;border:1px solid #fff5;border-radius:7px;padding:12px 16px;text-align:center;font-size:13px;max-width:82%}
.hidden{display:none!important}
#status{position:absolute;left:12px;bottom:max(12px,env(safe-area-inset-bottom));font-size:9px;color:#aaa;text-shadow:0 1px 4px #000;z-index:5}
@media(max-height:430px){
 .label{font-size:11px;padding:5px 7px}
 #lenses{padding-bottom:4px}.lens{height:32px;min-width:44px}
 #shutterRow{height:50px}#photo{width:46px;height:46px}
 #start{bottom:68px}
}
</style>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./sw.js").catch(function(e) {
      console.warn("Service worker registration failed:", e);
    });
  });
}
</script>
</head>
<body>
<div id="app">
<video id="camera" autoplay muted playsinline></video>
<canvas id="view"></canvas>

<div id="top">
 <div class="label">A35</div>
 <div class="label"><span id="lensReadout">50mm</span> · 2× · 2.39</div>
</div>

<div id="message">Tap START CAMERA</div>
<button id="start" type="button">START CAMERA</button>

<div id="bottom">
 <div id="lenses"></div>
 <div id="shutterRow"><button id="photo" type="button" aria-label="Take photo"></button></div>
</div>
<div id="status">ALEXA 35 · SUPER 35 · MASTER ANAMORPHIC</div>
</div>

<script>
(function(){
"use strict";

var video=document.getElementById("camera");
var canvas=document.getElementById("view");
var ctx=canvas.getContext("2d");
var start=document.getElementById("start");
var photo=document.getElementById("photo");
var message=document.getElementById("message");
var lensesEl=document.getElementById("lenses");
var lensReadout=document.getElementById("lensReadout");
var stream=null;
var selected=50;

var lenses=[
 {mm:28,aov:78.2},{mm:35,aov:65.5},{mm:40,aov:58.7},
 {mm:50,aov:48.5},{mm:60,aov:41.1},{mm:75,aov:33.4},
 {mm:100,aov:25.4},{mm:135,aov:18.9},{mm:180,aov:14.4}
];

function msg(t,visible){
 message.textContent=t;
 message.classList.toggle("hidden",!visible);
}
function lens(){
 for(var i=0;i<lenses.length;i++) if(lenses[i].mm===selected)return lenses[i];
 return lenses[3];
}
function renderLenses(){
 lensesEl.innerHTML="";
 for(var i=0;i<lenses.length;i++){
  (function(l){
   var b=document.createElement("button");
   b.type="button";b.className="lens"+(l.mm===selected?" active":"");
   b.textContent=l.mm+"mm";
   b.addEventListener("click",function(){
    selected=l.mm;
    lensReadout.textContent=l.mm+"mm";
    renderLenses();
    applyCrop();
   });
   lensesEl.appendChild(b);
  })(lenses[i]);
 }
}
function applyCrop(){
 var p=82,t=lens().aov;
 var z=Math.tan(p*Math.PI/360)/Math.tan(t*Math.PI/360);
 if(z<1)z=1;if(z>8)z=8;
 video.style.transform="scale("+z+")";
}
function resize(){
 var d=window.devicePixelRatio||1;
 canvas.width=Math.round(innerWidth*d);
 canvas.height=Math.round(innerHeight*d);
 canvas.style.width=innerWidth+"px";
 canvas.style.height=innerHeight+"px";
 draw();
}
function draw(){
 var d=window.devicePixelRatio||1,w=innerWidth,h=innerHeight;
 ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,w,h);
 var fw=w,fh=w/2.39;
 if(fh>h){fh=h;fw=h*2.39}
 var x=(w-fw)/2,y=(h-fh)/2;
 ctx.fillStyle="rgba(0,0,0,.58)";
 ctx.fillRect(0,0,w,y);ctx.fillRect(0,y+fh,w,h-y-fh);
 ctx.fillRect(0,y,x,fh);ctx.fillRect(x+fw,y,w-x-fw,fh);
 ctx.strokeStyle="rgba(255,255,255,.82)";ctx.lineWidth=1.5;
 ctx.strokeRect(x+.5,y+.5,fw-1,fh-1);
 ctx.strokeStyle="rgba(255,255,255,.32)";ctx.lineWidth=1;
 ctx.beginPath();ctx.moveTo(w/2-9,h/2);ctx.lineTo(w/2+9,h/2);
 ctx.moveTo(w/2,h/2-9);ctx.lineTo(w/2,h/2+9);ctx.stroke();
}
async function openCamera(){
 if(!window.isSecureContext){msg("Open the HTTPS Vercel address in Chrome.",true);return}
 if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
  msg("Camera API unavailable. Use Chrome on Android.",true);return
 }
 try{
  if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}
  msg("Opening camera…",true);

  // Start with the simplest reliable request. Do not use orientation.lock
  // or device-specific constraints before the camera is running.
  var s;
  try{
   s=await navigator.mediaDevices.getUserMedia({
    video:{facingMode:"environment",width:{ideal:1920},height:{ideal:1080}},
    audio:false
   });
  }catch(firstError){
   console.warn("Rear-camera request failed; falling back to any camera.",firstError);
   s=await navigator.mediaDevices.getUserMedia({video:true,audio:false});
  }

  stream=s;
  video.srcObject=s;

  video.onloadedmetadata=function(){
   video.play().then(function(){
    msg("",false);
    start.textContent="RESTART";
    applyCrop();
   }).catch(function(e){
    console.warn("play failed",e);
    msg("Camera opened. Tap START CAMERA again if the image is not visible.",true);
   });
  };
 }catch(e){
  console.error("Camera startup failed",e);
  var n=e&&e.name?e.name:"";
  var text=n==="NotAllowedError"?"Allow camera access for this site in Chrome.":
           n==="NotFoundError"?"No camera was found.":
           n==="NotReadableError"?"The camera is being used by another app.":
           n==="SecurityError"?"Chrome blocked camera access.":
           "Camera could not start.";
  msg(text,true);
 }
}
function takePhoto(){
 if(!stream || video.readyState<2){msg("Start the camera first.",true);return}
 try{
  var l=lens(),vw=video.videoWidth,vh=video.videoHeight,z=Math.max(1,Math.min(8,
   Math.tan(82*Math.PI/360)/Math.tan(l.aov*Math.PI/360)));
  var visibleW=vw/z,visibleH=vh/z,targetW=Math.min(visibleW,visibleH*2.39);
  var sx=(vw-visibleW)/2+(visibleW-targetW)/2,sy=(vh-visibleH)/2;
  var out=document.createElement("canvas"),ow=1920,oh=Math.round(ow/2.39);
  out.width=ow;out.height=oh;
  out.getContext("2d").drawImage(video,sx,sy,targetW,visibleH,0,0,ow,oh);
  out.toBlob(function(blob){
   if(!blob){msg("Photo capture failed.",true);return}
   var url=URL.createObjectURL(blob),a=document.createElement("a");
   a.href=url;a.download="A35_"+l.mm+"mm_2x_2.39_"+Date.now()+".jpg";
   document.body.appendChild(a);a.click();a.remove();
   setTimeout(function(){URL.revokeObjectURL(url)},1500);
  },"image/jpeg",.94);
 }catch(e){console.error(e);msg("Photo capture failed.",true)}
}
start.addEventListener("click",openCamera);
photo.addEventListener("click",takePhoto);
window.addEventListener("resize",resize);
window.addEventListener("orientationchange",function(){setTimeout(resize,300)});

renderLenses();resize();applyCrop();
})();
</script>
</body>
</html>
